<script>
    // Toggle Password Visibility Logic
    function toggleVisibility(inputId, btnElement) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
            btnElement.textContent = "HIDE";
        } else {
            input.type = "password";
            btnElement.textContent = "SHOW";
        }
    }

    // REAL Login Form Submission
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault(); 
        let isValid = true;
        
        const user = document.getElementById('loginUser');
        const pass = document.getElementById('loginPass');
        const userError = document.getElementById('loginUserError');
        const passError = document.getElementById('loginPassError');
        const globalError = document.getElementById('loginGlobalError');

        // Reset errors
        userError.style.display = 'none';
        passError.style.display = 'none';
        globalError.style.display = 'none';

        if (user.value.trim() === '') {
            userError.style.display = 'block';
            isValid = false;
        }

        if (pass.value.trim() === '') {
            passError.style.display = 'block';
            isValid = false;
        }

        if (isValid) {
            try {
                // Send real data to your backend API
                const response = await fetch('https://your-backend-api.com/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: user.value.trim(), 
                        password: pass.value 
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // Login successful - redirect user to the streaming page
                    window.location.href = "/dashboard.html";
                } else {
                    // Show error from backend (e.g., "Incorrect password")
                    globalError.style.color = 'var(--error-color)';
                    globalError.textContent = data.message || "Invalid username or password.";
                    globalError.style.display = 'block';
                }
            } catch (error) {
                globalError.style.color = 'var(--error-color)';
                globalError.textContent = "Network error. Please try again later.";
                globalError.style.display = 'block';
            }
        }
    });

    // REAL Sign Up Form Submission
    document.getElementById('signupForm').addEventListener('submit', async function(e) {
        e.preventDefault(); 
        let isValid = true;
        
        const fields = ['Name', 'Username', 'Email', 'Pass', 'ConfirmPass'];
        
        // Reset all errors
        fields.forEach(field => {
            document.getElementById('signup' + field + 'Error').style.display = 'none';
        });
        const globalError = document.getElementById('signupGlobalError');
        globalError.style.display = 'none';

        // Check for empty fields
        fields.forEach(field => {
            const el = document.getElementById('signup' + field);
            if (el.value.trim() === '') {
                document.getElementById('signup' + field + 'Error').style.display = 'block';
                isValid = false;
            }
        });

        const pass = document.getElementById('signupPass').value;
        const confirmPass = document.getElementById('signupConfirmPass').value;
        
        if (pass !== '' && confirmPass !== '' && pass !== confirmPass) {
            const confirmError = document.getElementById('signupConfirmPassError');
            confirmError.textContent = "Passwords do not match.";
            confirmError.style.display = 'block';
            isValid = false;
        }

        if (isValid) {
            try {
                // Send real data to your backend API to create a user in the database
                const response = await fetch('https://your-backend-api.com/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        fullName: document.getElementById('signupName').value.trim(),
                        username: document.getElementById('signupUsername').value.trim(),
                        email: document.getElementById('signupEmail').value.trim(),
                        password: pass 
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    globalError.style.color = '#4bb543'; 
                    globalError.textContent = "Account created! You can now log in.";
                    globalError.style.display = 'block';
                    this.reset();
                } else {
                    globalError.style.color = 'var(--error-color)';
                    globalError.textContent = data.message || "Failed to create account.";
                    globalError.style.display = 'block';
                }
            } catch (error) {
                globalError.style.color = 'var(--error-color)';
                globalError.textContent = "Network error. Please try again later.";
                globalError.style.display = 'block';
            }
        }
    });
</script>
