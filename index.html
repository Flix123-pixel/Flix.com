<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flix.com - VisionOS Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #000000;
            --panel-bg: rgba(255, 255, 255, 0.04);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-main: #f5f5f7;
            --text-dim: #86868b;
            --accent: #0A84FF;
            --accent-gradient: linear-gradient(135deg, #0A84FF, #BF5AF2);
            --danger: #FF453A;
            --admin-gold: #FFD60A;
            --ad-yellow: #fbbc05;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-base); 
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(10, 132, 255, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(191, 90, 242, 0.15), transparent 25%);
            background-attachment: fixed;
            color: var(--text-main); 
            overflow-x: hidden; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        /* Auth System */
        #authScreen { position: fixed; inset: 0; background: var(--bg-base); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .auth-box { width: 90%; max-width: 420px; padding: 40px; }
        .auth-tabs { display: flex; margin-bottom: 30px; border-bottom: 1px solid var(--panel-border); }
        .auth-tab { flex: 1; text-align: center; padding: 15px; cursor: pointer; color: var(--text-dim); font-weight: 700; font-size: 16px; transition: 0.3s; }
        .auth-tab.active { color: var(--text-main); border-bottom: 2px solid var(--text-main); }
        .auth-form { display: none; flex-direction: column; gap: 20px; }
        .auth-form.active { display: flex; }
        .auth-form input { padding: 16px; background: rgba(0,0,0,0.4); border: 1px solid var(--panel-border); border-radius: 12px; color: #fff; outline: none; font-size: 16px; transition: 0.3s; }
        .auth-form input:focus { border-color: var(--accent); background: rgba(255,255,255,0.08); }
        .auth-btn { background: var(--accent-gradient); color: #fff; border: none; padding: 16px; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.3s; }
        .auth-btn:hover { transform: scale(1.02); filter: brightness(1.1); }

        /* Header */
        header { height: 70px; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; border-bottom: 1px solid var(--panel-border); background: rgba(0,0,0,0.5); backdrop-filter: blur(20px); flex-shrink: 0; z-index: 100; }
        body.admin-mode header { border-bottom: 1px solid var(--admin-gold); }
        .logo { font-size: 26px; font-weight: 900; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; letter-spacing: -1px; }
        body.admin-mode .logo { background: linear-gradient(135deg, var(--admin-gold), #ff9900); -webkit-background-clip: text; }
        
        .header-actions { display: flex; align-items: center; gap: 16px; }
        .create-btn { background: var(--panel-bg); color: var(--text-main); border: 1px solid var(--panel-border); padding: 10px 20px; border-radius: 30px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; text-decoration: none; transition: 0.2s; backdrop-filter: blur(10px); }
        .create-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }
        .create-btn.primary { background: var(--text-main); color: #000; border: none; }
        .create-btn.primary:hover { background: #fff; transform: scale(1.05); }
        .sponsor-btn { background: var(--admin-gold); color: #000; border: none; }
        .sponsor-btn:hover { background: #ffea00; transform: scale(1.05); box-shadow: 0 0 15px rgba(255,214,10,0.4); }
        .profile-badge { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-gradient); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        body.admin-mode .profile-badge { background: var(--admin-gold); color: #000; }

        /* Layout */
        .app-body { display: flex; flex: 1; height: calc(100vh - 70px); overflow: hidden; position: relative; }
        
        /* Sidebar */
        aside.sidebar { width: 260px; border-right: 1px solid var(--panel-border); padding: 24px 16px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; background: rgba(0,0,0,0.3); backdrop-filter: blur(20px); }
        .side-link { display: flex; align-items: center; gap: 16px; padding: 14px 18px; border-radius: 16px; color: var(--text-dim); cursor: pointer; font-size: 15px; font-weight: 600; text-decoration: none; transition: 0.2s; }
        .side-link:hover { background: var(--panel-bg); color: var(--text-main); }
        .side-link.active { background: rgba(255,255,255,0.08); color: var(--text-main); }
        .admin-link { display: none; color: var(--admin-gold); }
        body.admin-mode .admin-link { display: flex; }

        /* Main Viewport */
        main.main-viewport { flex: 1; overflow-y: auto; padding: 24px; position: relative; }

        /* Category / Sort Bar */
        .category-bar { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 20px; scrollbar-width: none; border-bottom: 1px solid var(--panel-border); }
        .category-bar::-webkit-scrollbar { display: none; }
        .cat-chip { padding: 10px 20px; background: rgba(255,255,255,0.05); border: 1px solid var(--panel-border); border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: 0.2s; color: var(--text-dim); }
        .cat-chip:hover { background: rgba(255,255,255,0.1); color: var(--text-main); }
        .cat-chip.active { background: var(--text-main); color: #000; border-color: var(--text-main); }

        /* Grids & Cards */
        .tab-section { display: none; }
        .tab-section.active { display: block; animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .section-header { font-size: 22px; font-weight: 800; margin-bottom: 24px; display: flex; align-items: center; gap: 10px; letter-spacing: -0.5px; }
        .empty-state { text-align: center; padding: 80px 20px; color: var(--text-dim); font-size: 16px; font-weight: 500; border: 1px dashed var(--panel-border); border-radius: 24px; margin-top: 20px; }

        .del-btn { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); color: var(--text-main); border: 1px solid rgba(255,255,255,0.1); width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; z-index: 10; transition: 0.2s; opacity: 0.8; }
        .del-btn:hover { background: var(--danger); border-color: var(--danger); opacity: 1; transform: scale(1.1); }

        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
        .v-card { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 24px; overflow: hidden; transition: 0.3s; position: relative; }
        .v-card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,0.15); box-shadow: 0 12px 40px rgba(0,0,0,0.4); }
        .v-thumb { width: 100%; aspect-ratio: 16/9; background: #000; border-bottom: 1px solid var(--panel-border); }
        .v-meta { padding: 18px; display: flex; gap: 14px; }
        .v-avatar { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; font-size: 14px; }
        .v-info { flex: 1; }
        .v-info h4 { font-size: 16px; line-height: 1.4; margin-bottom: 4px; font-weight: 600; }
        .v-info p { font-size: 13px; color: var(--text-dim); font-weight: 500; }
        
        .ad-badge { background: var(--ad-yellow); color: #000; font-size: 10px; padding: 3px 6px; border-radius: 4px; font-weight: 800; margin-left: 6px; vertical-align: middle; }
        
        /* Modals */
        .modal-screen { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: none; align-items: center; justify-content: center; backdrop-filter: blur(12px); }
        .modal-window { width: 92%; max-width: 500px; max-height: 90vh; overflow-y: auto; padding: 32px; border-radius: 32px; }
        .close-btn { background: rgba(255,255,255,0.1); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .close-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.1); }

        @media (max-width: 768px) {
            aside.sidebar { display: none; }
            .category-bar { margin-top: 10px; }
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- AUTH SCREEN -->
    <div id="authScreen">
        <h1 class="logo" style="font-size: 48px; margin-bottom: 40px;">Flix</h1>
        <div class="auth-box glass-panel">
            <div class="auth-tabs">
                <div class="auth-tab active" id="tabLogin" onclick="switchAuth('login')">Sign In</div>
                <div class="auth-tab" id="tabSignup" onclick="switchAuth('signup')">Create Account</div>
            </div>
            <div class="auth-form active" id="formLogin">
                <input type="text" id="loginUser" placeholder="Username">
                <input type="password" id="loginPass" placeholder="Password">
                <button class="auth-btn" onclick="processAuth('login')">Continue</button>
            </div>
            <div class="auth-form" id="formSignup">
                <input type="text" id="signupUser" placeholder="Choose Username">
                <input type="password" id="signupPass" placeholder="Create Password">
                <button class="auth-btn" onclick="processAuth('signup')">Register</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="appWrapper" style="display: none;">
        <!-- Header -->
        <header>
            <a href="#" class="logo" onclick="switchTab('home')">Flix</a>
            <div class="header-actions">
                <a href="#" class="create-btn sponsor-btn hide-mobile" onclick="alert('Sponsor integration ready! Link this to PayPal/Stripe.')">💸 Sponsor Us</a>
                <button class="create-btn hide-mobile" onclick="openModal('botModal')">🤖 Link Bot</button>
                <button class="create-btn primary" onclick="openModal('uploadModal')">➕ Upload</button>
                <div class="profile-badge" id="myAvatar" onclick="logout()" title="Log Out">U</div>
            </div>
        </header>

        <div class="app-body">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="side-link active" id="side-home" onclick="switchTab('home')">🏠 Home</div>
                <div class="side-link" id="side-reels" onclick="switchTab('reels')">📱 Shorts</div>
                <div class="side-link" id="side-feed" onclick="switchTab('feed')">📸 Feed</div>
                <div class="side-link admin-link" id="side-admin" onclick="switchTab('admin')">👑 Admin</div>
                <div style="height: 1px; background: var(--panel-border); margin: 15px 0;"></div>
                <a href="#" class="side-link" onclick="alert('Ready for payments!')" style="color: var(--admin-gold);">💸 Sponsor Us</a>
                <div class="side-link" onclick="openModal('botModal')">🤖 Fix Broken Links</div>
                <div class="side-link" onclick="logout()" style="color: var(--danger); margin-top: auto;">🚪 Sign Out</div>
            </aside>

            <!-- Main Viewport -->
            <main class="main-viewport">
                
                <!-- Category Bar -->
                <div class="category-bar" id="catBar">
                    <div class="cat-chip active" onclick="setCategory('All', this)">All</div>
                    <div class="cat-chip" onclick="setCategory('Gaming', this)">Gaming</div>
                    <div class="cat-chip" onclick="setCategory('Funny', this)">Funny</div>
                    <div class="cat-chip" onclick="setCategory('Cartoons', this)">Cartoons</div>
                    <div class="cat-chip" onclick="setCategory('Horror', this)">Horror</div>
                    <div class="cat-chip" onclick="setCategory('AI Magic', this)">AI Magic</div>
                    <div class="cat-chip" onclick="setCategory('Crazy', this)">Crazy</div>
                </div>

                <!-- Home Tab -->
                <section id="tab-home" class="tab-section active">
                    <div class="video-grid" id="videoGrid"></div>
                </section>

                <!-- Reels Tab -->
                <section id="tab-reels" class="tab-section">
                    <div class="section-header">Shorts</div>
                    <div class="video-grid" id="reelsGrid" style="grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));"></div>
                </section>

                <!-- Feed Tab -->
                <section id="tab-feed" class="tab-section">
                    <div class="section-header">Timeline</div>
                    <div class="video-grid" id="feedWrap" style="max-width: 600px; margin: 0 auto; display: flex; flex-direction: column;"></div>
                </section>

                <!-- Admin Tab -->
                <section id="tab-admin" class="tab-section">
                    <div class="section-header" style="color: var(--admin-gold);">Admin Center</div>
                    <div class="glass-panel" style="padding: 24px; margin-bottom: 30px;">
                        <button class="create-btn primary" onclick="fixAllLinksInDb()">🔧 Auto-Fix All Database Links</button>
                    </div>

                    <!-- NEW: LIVE AD MANAGER -->
                    <div class="section-header" style="color: var(--ad-yellow); margin-top: 40px;">📺 Live Ad Manager</div>
                    <div class="glass-panel" style="padding: 24px; margin-bottom: 30px; border-color: rgba(251, 188, 5, 0.3);">
                        <label style="color: var(--text-dim); font-size: 13px; font-weight: 600;">Sponsor Company Name</label>
                        <input type="text" id="adSponsor" placeholder="e.g. Airtel India" style="width: 100%; padding: 14px; margin-top: 8px; margin-bottom: 16px; background: rgba(0,0,0,0.5); border: 1px solid var(--panel-border); border-radius: 12px; color: #fff; outline: none;">

                        <label style="color: var(--text-dim); font-size: 13px; font-weight: 600;">Ad Media URL (Link / Upload File)</label>
                        <input type="text" id="adUrl" placeholder="Paste Ad Link here..." style="width: 100%; padding: 14px; margin-top: 8px; margin-bottom: 16px; background: rgba(0,0,0,0.5); border: 1px solid var(--panel-border); border-radius: 12px; color: #fff; outline: none;">

                        <div style="display: flex; gap: 12px; margin-top: 10px;">
                            <button class="create-btn" onclick="generateAIAd()" style="flex: 1; justify-content: center; background: rgba(10, 132, 255, 0.1); color: var(--accent); border-color: var(--accent);">✨ Create AI Video</button>
                            <button class="create-btn" onclick="startAd()" style="flex: 1; justify-content: center; background: var(--ad-yellow); color: #000; border: none;">🚀 Start Ad</button>
                        </div>
                        
                        <div style="margin-top: 24px;">
                            <h4 style="color: var(--text-main); font-size: 14px; margin-bottom: 12px;">Active Running Ads</h4>
                            <div id="activeAdsList" style="display:flex; flex-direction:column; gap:10px;"></div>
                        </div>
                    </div>

                    <div class="section-header" style="font-size: 18px; color: var(--admin-gold); margin-top: 40px;">Registered Users</div>
                    <div id="adminUserList" style="display:flex; flex-direction:column; gap:12px;"></div>
                </section>
            </main>
        </div>
    </div>

    <!-- LINK BOT MODAL -->
    <div class="modal-screen" id="botModal">
        <div class="modal-window glass-panel" style="max-width: 420px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <h3 style="font-size: 20px; font-weight: 700;">Link Bot</h3>
                <button class="close-btn" onclick="closeModal('botModal')">✕</button>
            </div>
            <div style="display: flex; flex-direction: column; gap: 16px;">
                <input type="text" id="botInputUrl" placeholder="Paste Drive link..." style="padding: 16px; background: rgba(0,0,0,0.5); border: 1px solid var(--panel-border); border-radius: 12px; color: #fff; width: 100%; outline: none;">
                <button class="auth-btn" onclick="runLinkBot()">Convert URL</button>
                <div id="botResultBox" style="display: none; flex-direction: column; gap: 12px; margin-top: 10px;">
                    <textarea id="botOutputUrl" readonly rows="3" style="padding: 12px; background: rgba(0,0,0,0.5); border: 1px solid var(--panel-border); border-radius: 8px; color: var(--accent); resize: none;"></textarea>
                    <button class="create-btn" style="justify-content: center; width: 100%;" onclick="copyBotLink()">📋 Copy URL</button>
                </div>
            </div>
        </div>
    </div>

    <!-- UPLOAD MODAL -->
    <div class="modal-screen" id="uploadModal">
        <div class="modal-window glass-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <h3 style="font-size: 20px; font-weight: 700;">Create Post</h3>
                <button class="close-btn" onclick="closeModal('uploadModal')">✕</button>
            </div>
            <div style="display: flex; flex-direction: column; gap: 16px;">
                <select id="upType" style="padding: 16px; background: rgba(0,0,0,0.5); border: 1px solid var(--panel-border); border-radius: 12px; color: #fff; outline: none;">
                    <option value="video">Standard Video</option>
                    <option value="reel">Short (Reel)</option>
                    <option value="post">Social Feed Post</option>
                </select>

                <select id="upCategory" style="padding: 16px; background: rgba(0,0,0,0.5); border: 1px solid var(--panel-border); border-radius: 12px; color: #fff; outline: none;">
                    <option value="Gaming">Gaming</option>
                    <option value="Funny">Funny</option>
                    <option value="Cartoons">Cartoons</option>
                    <option value="Horror">Horror</option>
                    <option value="AI Magic">AI Magic</option>
                    <option value="Crazy">Crazy</option>
                </select>

                <input type="text" id="upFile" placeholder="Media URL (YouTube or MP4)..." style="padding: 16px; background: rgba(0,0,0,0.5); border: 1px solid var(--panel-border); border-radius: 12px; color: #fff; outline: none;">
                <input type="text" id="upTitle" placeholder="Caption / Title..." style="padding: 16px; background: rgba(0,0,0,0.5); border: 1px solid var(--panel-border); border-radius: 12px; color: #fff; outline: none;">

                <div id="adminBroadcastDiv" style="display: none; align-items: center; gap: 10px; margin-top: 5px; background: rgba(255, 214, 10, 0.1); padding: 16px; border-radius: 12px; border: 1px solid var(--admin-gold);">
                    <input type="checkbox" id="adminBroadcastCheck" style="width: 18px; height: 18px;">
                    <label for="adminBroadcastCheck" style="color: var(--admin-gold); font-weight: 700;">Global Override Broadcast</label>
                </div>
                <button class="auth-btn" style="margin-top: 10px;" onclick="handlePublish()">Publish</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. FIREBASE SETUP ---
        const firebaseConfig = { apiKey: "AIzaSyBF-TU2fwc7lR2M8wFfKpJvSYNiLz3Xinw", authDomain: "flix-r11121117.firebaseapp.com", projectId: "flix-r11121117", storageBucket: "flix-r11121117.firebasestorage.app", messagingSenderId: "278303851580", appId: "1:278303851580:web:b185040ce65eae24ac2f39" };
        firebase.initializeApp(firebaseConfig);
        const dbRef = firebase.firestore().collection("flix_data").doc("main_database");

        let db = { users: [], videos: [], reels: [], posts: [], ads: [] };
        let currentUser = JSON.parse(localStorage.getItem('flix_currentUser_v3')) || null;
        let activeCategory = 'All'; 

        dbRef.onSnapshot((doc) => {
            if (doc.exists) {
                const data = doc.data();
                db = { ...db, ...data }; 
                if (!db.ads) db.ads = []; // Ensure ads array exists
                if (currentUser) { renderAll(); if (currentUser.role === 'admin') { renderAdminUsers(); renderAdminAds(); } }
            }
        });

        async function saveDb() {
            try { await dbRef.set(db); localStorage.setItem('flix_currentUser_v3', JSON.stringify(currentUser)); } 
            catch (e) { alert("Server Sync Failed."); }
        }

        // --- 2. AUTHENTICATION ---
        function switchAuth(mode) {
            document.querySelectorAll('.auth-tab, .auth-form').forEach(el => el.classList.remove('active'));
            if(mode === 'login') { document.getElementById('tabLogin').classList.add('active'); document.getElementById('formLogin').classList.add('active'); } 
            else { document.getElementById('tabSignup').classList.add('active'); document.getElementById('formSignup').classList.add('active'); }
        }

        function processAuth(mode) {
            const user = document.getElementById(mode + 'User').value.trim();
            const pass = document.getElementById(mode + 'Pass').value.trim();
            if(!user || !pass) return;

            if (user === 'qwerty123456' && pass === 'qwerty123456') { currentUser = { username: "The Developer", role: "admin" }; saveDb(); initApp(); return; }

            if (mode === 'signup') {
                if (db.users.find(u => u.username.toLowerCase() === user.toLowerCase())) return alert("Username already taken.");
                const newUser = { username: user, password: pass, role: "user" };
                db.users.push(newUser); currentUser = newUser; saveDb(); initApp();
            } else {
                const found = db.users.find(u => u.username.toLowerCase() === user.toLowerCase() && u.password === pass);
                if (found) { currentUser = found; saveDb(); initApp(); } else { alert("Incorrect credentials."); }
            }
        }

        function logout() { if(confirm("Sign out?")) { currentUser = null; localStorage.removeItem('flix_currentUser_v3'); location.reload(); } }

        function initApp() {
            if(!currentUser) { document.getElementById('authScreen').style.display = 'flex'; document.getElementById('appWrapper').style.display = 'none'; return; }
            document.getElementById('authScreen').style.display = 'none'; document.getElementById('appWrapper').style.display = 'flex';
            document.getElementById('myAvatar').innerText = currentUser.username.charAt(0).toUpperCase();

            if(currentUser.role === 'admin') { document.body.classList.add('admin-mode'); document.getElementById('adminBroadcastDiv').style.display = 'flex'; } 
            else { document.body.classList.remove('admin-mode'); document.getElementById('adminBroadcastDiv').style.display = 'none'; }
            renderAll();
        }

        function switchTab(name) {
            document.querySelectorAll('.tab-section, .side-link, .nav-item').forEach(el => el.classList.remove('active'));
            if(document.getElementById(`tab-${name}`)) document.getElementById(`tab-${name}`).classList.add('active');
            if(document.getElementById(`side-${name}`)) document.getElementById(`side-${name}`).classList.add('active');
            document.getElementById('catBar').style.display = (name === 'home') ? 'flex' : 'none'; 
            if(name === 'admin' && currentUser.role === 'admin') { renderAdminUsers(); renderAdminAds(); }
        }

        function setCategory(cat, element) {
            activeCategory = cat;
            document.querySelectorAll('.cat-chip').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            renderVideos(); 
        }

        function deletePost(type, id) { if(confirm("Delete this?")) { db[type] = db[type].filter(item => item.id !== id); saveDb(); renderAll(); if(type === 'ads') renderAdminAds(); } }

        function getMediaHTML(url, className, autoplay = false) {
            if (!url) return `<div class="${className}" style="background:#111; display:flex; align-items:center; justify-content:center; color: var(--text-dim);">No Media Provided</div>`;
            const ytMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|live\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
            if (ytMatch && ytMatch[1]) return `<iframe class="${className}" src="https://www.youtube.com/embed/${ytMatch[1]}${autoplay ? "?autoplay=1&mute=1" : ""}" frameborder="0" allowfullscreen></iframe>`;
            const driveMatch = url.match(/drive\.google\.com\/.*(?:id=|\/d\/)([\w-]+)/);
            if (driveMatch && driveMatch[1]) return `<iframe class="${className}" src="https://drive.google.com/file/d/${driveMatch[1]}/preview" frameborder="0" allowfullscreen></iframe>`;
            return `<video src="${url}" class="${className}" style="object-fit: ${className==='v-thumb'?'cover':'contain'}; background: #000;" ${autoplay ? 'autoplay loop muted' : 'controls'}></video>`;
        }

        function getAvatar(name) { return name === 'The Developer' ? '👑' : name.charAt(0).toUpperCase(); }

        function renderAll() { renderVideos(); renderReels(); renderPosts(); }

        // --- NEW: DYNAMIC AD SYSTEM ---
        function renderVideos() {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '';
            
            let filteredVideos = db.videos;
            if (activeCategory !== 'All') { filteredVideos = db.videos.filter(v => v.category === activeCategory); }

            if(filteredVideos.length === 0) { grid.innerHTML = `<div class="empty-state">No videos found for ${activeCategory}. Be the first to upload!</div>`; return; }
            
            let adCounter = 0;
            let activeAds = db.ads || [];
            
            filteredVideos.forEach((v, index) => {
                // INJECT DYNAMIC ADS FROM DATABASE
                if (index > 0 && index % 4 === 0 && activeAds.length > 0) {
                    const ad = activeAds[adCounter % activeAds.length];
                    grid.innerHTML += `
                        <div class="v-card" style="border-color: var(--ad-yellow);">
                            ${getMediaHTML(ad.url, 'v-thumb', true)}
                            <div class="v-meta">
                                <div class="v-avatar" style="background: var(--ad-yellow); color: #000;">$</div>
                                <div class="v-info">
                                    <h4>${ad.title} <span class="ad-badge">Sponsored</span></h4>
                                    <p>${ad.sponsor}</p>
                                </div>
                            </div>
                        </div>`;
                    adCounter++;
                }

                const delBtn = (currentUser.username === v.author || currentUser.role === 'admin') ? `<button class="del-btn" onclick="deletePost('videos', '${v.id}')">🗑️</button>` : '';
                grid.innerHTML += `
                    <div class="v-card" style="${v.isWorldwide ? 'border-color: var(--admin-gold);' : ''}">
                        ${delBtn}
                        ${getMediaHTML(v.videoData, 'v-thumb')}
                        <div class="v-meta">
                            <div class="v-avatar">${getAvatar(v.author)}</div>
                            <div class="v-info">
                                <h4>${v.title} ${v.isWorldwide ? '<span class="ad-badge" style="background:var(--admin-gold);">GLOBAL</span>' : ''}</h4>
                                <p>${v.author} • ${v.category || 'General'}</p>
                            </div>
                        </div>
                    </div>`;
            });
        }

        function renderReels() {
            const grid = document.getElementById('reelsGrid');
            if(db.reels.length === 0) return grid.innerHTML = `<div class="empty-state">No shorts available.</div>`;
            grid.innerHTML = '';
            db.reels.forEach(r => {
                const delBtn = (currentUser.username === r.author || currentUser.role === 'admin') ? `<button class="del-btn" onclick="deletePost('reels', '${r.id}')">🗑️</button>` : '';
                grid.innerHTML += `
                    <div class="v-card" style="aspect-ratio: 9/16;">
                        ${delBtn}
                        ${getMediaHTML(r.videoData, 'r-bg', true)}
                        <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 15px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); pointer-events: none;">
                            <strong style="color:#fff; display:block; margin-bottom:5px;">${r.title}</strong>
                            <span style="color:rgba(255,255,255,0.7); font-size: 13px;">@${r.author}</span>
                        </div>
                    </div>`;
            });
        }

        function renderPosts() {
            const wrap = document.getElementById('feedWrap');
            if(db.posts.length === 0) return wrap.innerHTML = `<div class="empty-state">Timeline is empty.</div>`;
            wrap.innerHTML = '';
            db.posts.forEach(p => {
                const delBtn = (currentUser.username === p.author || currentUser.role === 'admin') ? `<button class="del-btn" onclick="deletePost('posts', '${p.id}')">🗑️</button>` : '';
                wrap.innerHTML += `
                    <div class="v-card">
                        ${delBtn}
                        <div style="padding: 16px; display: flex; align-items: center; gap: 14px;">
                            <div class="v-avatar">${getAvatar(p.author)}</div>
                            <strong>${p.author}</strong>
                        </div>
                        ${getMediaHTML(p.videoData, 'v-thumb', false)}
                        <div style="padding: 16px;">
                            <strong style="margin-right: 8px;">${p.author}</strong><span style="color:var(--text-dim);">${p.caption}</span>
                        </div>
                    </div>`;
            });
        }

        // --- NEW: AD MANAGER LOGIC ---
        function generateAIAd() {
            const sponsor = document.getElementById('adSponsor').value.trim().toLowerCase();
            const urlInput = document.getElementById('adUrl');
            
            if (!sponsor) return alert("Please enter a company name first!");
            
            if (sponsor.includes('airtel')) {
                urlInput.value = "https://www.youtube.com/watch?v=R08Mep-g0_c";
            } else if (sponsor.includes('wheel')) {
                urlInput.value = "https://www.youtube.com/watch?v=zUe3sUxs_3I";
            } else {
                urlInput.value = "https://www.youtube.com/watch?v=dQw4w9WgXcQ"; 
            }
            alert(`AI Video Generated for ${sponsor.toUpperCase()}! You can now click Start Ad.`);
        }

        function startAd() {
            const sponsor = document.getElementById('adSponsor').value.trim();
            const rawUrl = document.getElementById('adUrl').value.trim();
            
            if (!sponsor || !rawUrl) return alert("Please fill in both Sponsor Name and Media URL.");
            
            const fixedUrl = fixDriveLink(rawUrl);
            const newAd = { id: Date.now().toString(), sponsor: sponsor, title: "Sponsored Message", url: fixedUrl };
            
            if (!db.ads) db.ads = [];
            db.ads.push(newAd);
            saveDb();
            
            document.getElementById('adSponsor').value = '';
            document.getElementById('adUrl').value = '';
            renderAdminAds();
            renderAll();
            alert("Ad is now LIVE and broadcasting to users!");
        }

        function renderAdminAds() {
            const list = document.getElementById('activeAdsList');
            if(!db.ads || db.ads.length === 0) {
                list.innerHTML = `<div style="color:var(--text-dim); font-size:13px;">No active ads currently running.</div>`;
                return;
            }
            list.innerHTML = '';
            db.ads.forEach(ad => {
                list.innerHTML += `
                    <div style="background:rgba(251, 188, 5, 0.1); padding: 12px; border-radius: 8px; border: 1px solid rgba(251, 188, 5, 0.3); display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <strong style="color: var(--ad-yellow); font-size: 14px;">${ad.sponsor}</strong><br>
                            <span style="font-size: 12px; color: var(--text-dim);">${ad.url.substring(0, 30)}...</span>
                        </div>
                        <button class="create-btn" style="background: rgba(255,69,58,0.2); color: var(--danger); border: none; padding: 6px 12px;" onclick="deletePost('ads', '${ad.id}')">Stop Ad</button>
                    </div>`;
            });
        }

        function renderAdminUsers() {
            const list = document.getElementById('adminUserList');
            list.innerHTML = db.users.length === 0 ? `<div style="color:var(--text-dim); font-size:14px;">No users registered yet.</div>` : '';
            db.users.forEach(u => {
                list.innerHTML += `
                    <div class="glass-panel" style="padding:16px; display:flex; justify-content:space-between; align-items:center;">
                        <div><strong style="font-size:16px;">@${u.username}</strong><br><span style="font-size:13px; color:var(--text-dim);">Pass: ${u.password}</span></div>
                        <button class="create-btn" style="background:rgba(255,69,58,0.1); color:var(--danger);" onclick="deleteUser('${u.username}')">Ban</button>
                    </div>`;
            });
        }
        function deleteUser(username) { db.users = db.users.filter(u => u.username !== username); saveDb(); renderAdminUsers(); }

        // --- LINK BOT & PUBLISHING ---
        function fixDriveLink(url) {
            if (!url || url.includes('youtube') || url.includes('youtu.be')) return url; 
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            return match && match[1] ? `https://drive.google.com/uc?export=download&id=${match[1]}` : url;
        }

        function runLinkBot() {
            const raw = document.getElementById('botInputUrl').value.trim();
            if (!raw) return alert("Please enter a link first.");
            document.getElementById('botOutputUrl').value = fixDriveLink(raw);
            document.getElementById('botResultBox').style.display = 'flex';
        }
        function copyBotLink() { const copyText = document.getElementById("botOutputUrl"); copyText.select(); navigator.clipboard.writeText(copyText.value); alert("URL copied."); }
        function fixAllLinksInDb() {
            if (currentUser?.role !== 'admin') return;
            const fixArray = (arr) => arr.forEach(i => { if(i.videoData) i.videoData = fixDriveLink(i.videoData); });
            fixArray(db.videos); fixArray(db.reels); fixArray(db.posts); saveDb(); renderAll(); alert("Database has been auto-fixed.");
        }

        function handlePublish() {
            const type = document.getElementById('upType').value;
            const title = document.getElementById('upTitle').value || "New Post";
            const category = document.getElementById('upCategory').value; 
            const isWorldwide = document.getElementById('adminBroadcastCheck')?.checked || false;
            const videoUrl = fixDriveLink(document.getElementById('upFile').value.trim());

            const item = { 
                id: Date.now().toString(), 
                author: currentUser.username, 
                title, 
                caption: title, 
                category, 
                isWorldwide, 
                videoData: videoUrl 
            };

            if(type === 'video') { db.videos.unshift(item); switchTab('home'); setCategory(category, document.querySelector(`.cat-chip:contains('${category}')`)); }
            else if(type === 'reel') { db.reels.unshift(item); switchTab('reels'); }
            else if(type === 'post') { db.posts.unshift(item); switchTab('feed'); }

            saveDb(); closeModal('uploadModal');
            document.getElementById('upTitle').value = ''; document.getElementById('upFile').value = '';
            if(document.getElementById('adminBroadcastCheck')) document.getElementById('adminBroadcastCheck').checked = false;
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        dbRef.get().then((doc) => { if (doc.exists) { db = { ...db, ...doc.data() }; } initApp(); }).catch(() => initApp());
    </script>
</body>
</html>
