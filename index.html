<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flix.com - All-in-One Social & Video</title>
    <style>
        :root {
            --primary: #ff0055;
            --secondary: #ffaa00;
            --bg-dark: #0a0a0c;
            --card-dark: #141418;
            --border: #26262e;
            --text-main: #f4f4f6;
            --text-sub: #9090a0;
            --admin-gold: #ffd700;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-dark); color: var(--text-main); overflow-x: hidden; height: 100vh; display: flex; flex-direction: column; }

        /* Full Screen Auth Overlay */
        #authScreen { position: fixed; inset: 0; background: var(--bg-dark); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .auth-box { background: var(--card-dark); border: 1px solid var(--border); border-radius: 16px; width: 90%; max-width: 400px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .auth-tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
        .auth-tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; color: var(--text-sub); font-weight: bold; transition: 0.2s; }
        .auth-tab.active { color: var(--secondary); border-bottom: 2px solid var(--secondary); }
        .auth-form { display: none; flex-direction: column; gap: 16px; }
        .auth-form.active { display: flex; }
        .auth-form input { padding: 12px; background: #1c1c24; border: 1px solid var(--border); border-radius: 8px; color: #fff; outline: none; font-size: 14px; }
        .auth-form input:focus { border-color: var(--secondary); }
        .auth-btn { background: linear-gradient(45deg, var(--primary), var(--secondary)); color: #fff; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }

        /* Top Header */
        header { height: 60px; background: #101014; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; z-index: 100; transition: border-bottom 0.3s; }
        body.admin-mode header { border-bottom: 2px solid var(--admin-gold); box-shadow: 0 4px 15px rgba(255, 215, 0, 0.1); }
        .logo { font-size: 22px; font-weight: 900; background: linear-gradient(45deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; letter-spacing: -0.5px; }
        body.admin-mode .logo { background: linear-gradient(45deg, var(--admin-gold), #ffaa00); -webkit-background-clip: text; }
        
        .search-bar { display: flex; flex: 0 1 450px; margin: 0 12px; }
        .search-bar input { width: 100%; padding: 8px 14px; background: #1c1c24; border: 1px solid var(--border); border-radius: 20px 0 0 20px; color: #fff; outline: none; font-size: 13px; }
        .search-bar button { padding: 8px 16px; background: #262630; border: 1px solid var(--border); border-left: none; border-radius: 0 20px 20px 0; color: #fff; cursor: pointer; }

        .header-actions { display: flex; align-items: center; gap: 10px; }
        .create-btn { background: linear-gradient(45deg, var(--primary), var(--secondary)); color: #fff; border: none; padding: 7px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px; text-decoration: none; }
        .wiki-btn { background: #262630; border: 1px solid var(--border); color: #fff; }
        body.admin-mode .create-btn:not(.wiki-btn) { background: linear-gradient(45deg, #000, var(--admin-gold)); color: #000; }
        .profile-badge { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(45deg, #00c6ff, #0072ff); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; cursor: pointer; position: relative; }
        body.admin-mode .profile-badge { background: linear-gradient(45deg, var(--admin-gold), #ffaa00); color: #000; box-shadow: 0 0 10px var(--admin-gold); }

        /* Container & Layout */
        .app-body { display: flex; flex: 1; height: calc(100vh - 60px); overflow: hidden; position: relative; }
        
        /* Desktop Sidebar */
        aside.sidebar { width: 220px; background: #101014; border-right: 1px solid var(--border); padding: 12px 8px; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
        .side-link { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px; color: var(--text-sub); cursor: pointer; font-size: 14px; font-weight: 600; text-decoration: none; transition: 0.15s; }
        .side-link:hover { background: #1a1a22; color: #fff; }
        .side-link.active { background: #262632; color: #fff; }
        .admin-link { display: none; color: var(--admin-gold); }
        body.admin-mode .admin-link { display: flex; }

        /* Main Viewport */
        main.main-viewport { flex: 1; overflow-y: auto; padding: 16px; position: relative; }

        /* Mobile Bottom Bar */
        .bottom-nav { display: none; height: 55px; background: #101014; border-top: 1px solid var(--border); position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; justify-content: space-around; align-items: center; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: var(--text-sub); cursor: pointer; }
        .nav-item.active { color: var(--primary); font-weight: bold; }
        body.admin-mode .nav-item.active { color: var(--admin-gold); }
        .nav-item i { font-style: normal; font-size: 18px; }

        /* Stories Row */
        .stories-bar { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 16px; scrollbar-width: none; }
        .stories-bar::-webkit-scrollbar { display: none; }
        .story-circle { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; min-width: 68px; }
        .ring { width: 62px; height: 62px; border-radius: 50%; background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); padding: 2.5px; display: flex; align-items: center; justify-content: center; }
        .ring-avatar { width: 100%; height: 100%; border-radius: 50%; background: #202028; border: 2px solid var(--bg-dark); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; }
        .story-name { font-size: 11px; color: var(--text-sub); width: 64px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Grids & Cards */
        .tab-section { display: none; }
        .tab-section.active { display: block; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        .section-header { font-size: 18px; font-weight: 800; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }

        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-sub); }

        /* YouTube Grid */
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 30px; }
        .v-card { cursor: pointer; border-radius: 12px; overflow: hidden; background: var(--card-dark); border: 1px solid var(--border); transition: transform 0.15s; }
        .v-card:hover { transform: translateY(-3px); }
        .v-thumb { width: 100%; aspect-ratio: 16/9; background: #252530; display: flex; align-items: center; justify-content: center; position: relative; font-size: 32px; background-size: cover; background-position: center; }
        .v-time { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.8); font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .v-meta { padding: 12px; display: flex; gap: 10px; }
        .v-avatar { width: 34px; height: 34px; border-radius: 50%; background: #343444; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; font-size: 13px; }
        .v-info h4 { font-size: 14px; line-height: 1.3; margin-bottom: 4px; }
        .v-info p { font-size: 12px; color: var(--text-sub); }
        .admin-badge { background: var(--admin-gold); color: #000; font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 6px; font-weight: bold; }

        /* Reels Grid */
        .reels-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
        .r-card { aspect-ratio: 9/16; border-radius: 14px; overflow: hidden; position: relative; cursor: pointer; background: #222; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; }
        .r-card:hover { transform: scale(1.02); }
        .r-bg { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 36px; background-size: cover; background-position: center; }
        .r-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 45%); display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; pointer-events: none; }

        /* Social Posts Feed */
        .feed-wrap { max-width: 540px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .post-card { background: var(--card-dark); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .post-top { padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
        .post-media { width: 100%; aspect-ratio: 1/1; background: #232330; display: flex; align-items: center; justify-content: center; font-size: 48px; background-size: cover; background-position: center; overflow: hidden; }
        .post-actions { padding: 10px 14px; display: flex; gap: 16px; font-size: 20px; }
        .post-caption-box { padding: 0 14px 12px 14px; font-size: 13px; line-height: 1.4; }

        /* Admin Users Panel */
        .admin-user-list { display: flex; flex-direction: column; gap: 10px; }
        .admin-user-card { background: #1c1c24; padding: 12px; border-radius: 8px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }

        /* Modals & Overlays */
        .modal-screen { position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 200; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-window { background: #16161c; border: 1px solid var(--border); border-radius: 14px; width: 92%; max-width: 440px; max-height: 90vh; overflow-y: auto; padding: 20px; }
        .close-btn { background: none; border: none; color: #aaa; font-size: 24px; cursor: pointer; }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            aside.sidebar { display: none; }
            .bottom-nav { display: flex; }
            main.main-viewport { padding: 12px 10px 70px 10px; }
            .search-bar { display: none; }
        }
    </style>
</head>
<body>

    <!-- MANDOATARY AUTH SCREEN -->
    <div id="authScreen">
        <h1 class="logo" style="font-size: 40px; margin-bottom: 30px;">FLIX.COM</h1>
        <div class="auth-box">
            <div class="auth-tabs">
                <div class="auth-tab" id="tabLogin" onclick="switchAuth('login')">Log In</div>
                <div class="auth-tab active" id="tabSignup" onclick="switchAuth('signup')">Sign Up</div>
            </div>

            <!-- Login Form -->
            <div class="auth-form" id="formLogin">
                <input type="text" id="loginUser" placeholder="Username">
                <input type="password" id="loginPass" placeholder="Password">
                <button class="auth-btn" onclick="processAuth('login')">Log In</button>
            </div>

            <!-- Sign Up Form -->
            <div class="auth-form active" id="formSignup">
                <input type="text" id="signupUser" placeholder="Choose a username">
                <input type="password" id="signupPass" placeholder="Create a password">
                <button class="auth-btn" onclick="processAuth('signup')">Create Account</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="appWrapper" style="display: none; height: 100vh; flex-direction: column;">
        <!-- Header -->
        <header>
            <a href="#" class="logo" onclick="switchTab('home')">FLIX.COM</a>
            <div class="search-bar">
                <input type="text" placeholder="Search content...">
                <button>🔍</button>
            </div>
            <div class="header-actions">
                <!-- WIKI LINK IN HEADER FOR MOBILE/DESKTOP -->
                <a href="https://github.com/Flix123-pixel/Flix.com.wiki.git" target="_blank" class="create-btn wiki-btn">📖 <span>Our Wiki</span></a>
                
                <button class="create-btn" onclick="openModal('uploadModal')">➕ <span>Create</span></button>
                <div class="profile-badge" id="myAvatar" onclick="logout()" title="Log Out">U</div>
            </div>
        </header>

        <div class="app-body">
            <!-- Sidebar Navigation -->
            <aside class="sidebar">
                <div class="side-link active" id="side-home" onclick="switchTab('home')">🏠 <span>Home</span></div>
                <div class="side-link" id="side-reels" onclick="switchTab('reels')">📱 <span>Reels</span></div>
                <div class="side-link" id="side-feed" onclick="switchTab('feed')">📸 <span>Social Feed</span></div>
                <div class="side-link admin-link" id="side-admin" onclick="switchTab('admin')">👑 <span>Admin Panel</span></div>
                
                <div style="height: 1px; background: var(--border); margin: 10px 0;"></div>
                
                <!-- WIKI LINK IN SIDEBAR -->
                <a href="https://github.com/Flix123-pixel/Flix.com.wiki.git" target="_blank" class="side-link" style="color: var(--text-main);">📖 <span>Our Wiki</span></a>
                <div class="side-link" onclick="logout()" style="color: #ff4444;">🚪 <span>Log Out</span></div>
            </aside>

            <!-- Main Viewport -->
            <main class="main-viewport">
                <!-- Stories Row -->
                <div class="stories-bar" id="storiesBar"></div>

                <!-- Home Tab -->
                <section id="tab-home" class="tab-section active">
                    <div class="section-header">▶️ Recommended Videos</div>
                    <div class="video-grid" id="videoGrid"></div>
                </section>

                <!-- Reels Tab -->
                <section id="tab-reels" class="tab-section">
                    <div class="section-header">📱 Trending Reels</div>
                    <div class="reels-grid" id="reelsGrid"></div>
                </section>

                <!-- Feed Tab -->
                <section id="tab-feed" class="tab-section">
                    <div class="section-header" style="justify-content: center;">📸 Community Posts</div>
                    <div class="feed-wrap" id="feedWrap"></div>
                </section>

                <!-- Admin Tab -->
                <section id="tab-admin" class="tab-section">
                    <div class="section-header" style="color: var(--admin-gold);">👑 Admin Dashboard - User Control</div>
                    <div class="admin-user-list" id="adminUserList"></div>
                </section>
            </main>
        </div>

        <!-- Mobile Bottom Navigation -->
        <nav class="bottom-nav">
            <div class="nav-item active" id="nav-home" onclick="switchTab('home')"><i>🏠</i><span>Home</span></div>
            <div class="nav-item" id="nav-reels" onclick="switchTab('reels')"><i>📱</i><span>Reels</span></div>
            <div class="nav-item" onclick="openModal('uploadModal')"><i style="font-size: 24px;">➕</i><span>Post</span></div>
            <div class="nav-item" id="nav-feed" onclick="switchTab('feed')"><i>📸</i><span>Feed</span></div>
            <div class="nav-item admin-link" id="nav-admin" onclick="switchTab('admin')"><i>👑</i><span>Admin</span></div>
        </nav>
    </div>

    <!-- UPLOAD MODAL -->
    <div class="modal-screen" id="uploadModal">
        <div class="modal-window">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3>Create Post</h3>
                <button class="close-btn" onclick="closeModal('uploadModal')">✕</button>
            </div>
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <label style="font-size: 12px; color: var(--text-sub);">Select Format</label>
                <select id="upType" style="padding: 10px; background: #202028; border: 1px solid var(--border); border-radius: 6px; color: #fff;">
                    <option value="video">Long Video</option>
                    <option value="reel">Reel / Short</option>
                    <option value="post">Feed Post</option>
                    <option value="story">Story</option>
                </select>

                <label style="font-size: 12px; color: var(--text-sub);">Video / Media File (MP4)</label>
                <input type="file" id="upFile" accept="video/mp4, video/webm, video/*" style="padding: 10px; background: #202028; border: 1px solid var(--border); border-radius: 6px; color: #fff;">

                <label style="font-size: 12px; color: var(--text-sub);">Caption</label>
                <input type="text" id="upTitle" placeholder="Write caption or title..." style="padding: 10px; background: #202028; border: 1px solid var(--border); border-radius: 6px; color: #fff;">

                <div id="adminBroadcastDiv" style="display: none; align-items: center; gap: 10px; margin-top: 5px; background: #2a2000; padding: 10px; border-radius: 6px; border: 1px solid var(--admin-gold);">
                    <input type="checkbox" id="adminBroadcastCheck">
                    <label for="adminBroadcastCheck" style="color: var(--admin-gold); font-weight: bold; font-size: 12px;">🌍 WORLDWIDE BROADCAST</label>
                </div>

                <button class="create-btn" style="width: 100%; justify-content: center; padding: 12px; margin-top: 10px;" onclick="handlePublish()">Publish to Flix</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. EMPTY DATABASE SYSTEM ---
        let db = JSON.parse(localStorage.getItem('flix_db_v2')) || {
            users: [],
            videos: [],
            reels: [],
            posts: [],
            stories: []
        };
        let currentUser = JSON.parse(localStorage.getItem('flix_currentUser_v2')) || null;

        function saveDb() {
            try {
                localStorage.setItem('flix_db_v2', JSON.stringify(db));
                localStorage.setItem('flix_currentUser_v2', JSON.stringify(currentUser));
            } catch (e) {
                if (e.name === "QuotaExceededError") {
                    alert("Storage limit exceeded! The video file is too large for local storage caching. Please upload a smaller file or clear your browser data.");
                }
            }
        }

        // --- 2. AUTHENTICATION & SECRET ADMIN LOGIN ---
        function switchAuth(mode) {
            document.getElementById('tabLogin').classList.remove('active');
            document.getElementById('tabSignup').classList.remove('active');
            document.getElementById('formLogin').classList.remove('active');
            document.getElementById('formSignup').classList.remove('active');

            if(mode === 'login') {
                document.getElementById('tabLogin').classList.add('active');
                document.getElementById('formLogin').classList.add('active');
            } else {
                document.getElementById('tabSignup').classList.add('active');
                document.getElementById('formSignup').classList.add('active');
            }
        }

        function processAuth(mode) {
            const user = document.getElementById(mode + 'User').value.trim();
            const pass = document.getElementById(mode + 'Pass').value.trim();

            if(!user || !pass) { alert("Please fill in all fields."); return; }

            // SECRET ADMIN BACKDOOR
            if (mode === 'signup' && user === 'qwerty123456' && pass === 'qwerty123456') {
                currentUser = { username: "The Developer", role: "admin" };
                saveDb();
                initApp();
                return;
            }

            if (mode === 'signup') {
                const exists = db.users.find(u => u.username.toLowerCase() === user.toLowerCase());
                if (exists) { alert("Username already taken!"); return; }
                
                const newUser = { username: user, password: pass, role: "user" };
                db.users.push(newUser);
                currentUser = newUser;
                saveDb();
                initApp();
            } else if (mode === 'login') {
                if (user === 'qwerty123456' && pass === 'qwerty123456') {
                    currentUser = { username: "The Developer", role: "admin" };
                    saveDb();
                    initApp();
                    return;
                }

                const found = db.users.find(u => u.username.toLowerCase() === user.toLowerCase() && u.password === pass);
                if (found) {
                    currentUser = found;
                    saveDb();
                    initApp();
                } else {
                    alert("Invalid credentials.");
                }
            }
        }

        function logout() {
            if(confirm("Are you sure you want to log out?")) {
                currentUser = null;
                saveDb();
                location.reload(); 
            }
        }

        // --- 3. APP INITIALIZATION & UI RENDERING ---
        function initApp() {
            if(!currentUser) {
                document.getElementById('authScreen').style.display = 'flex';
                document.getElementById('appWrapper').style.display = 'none';
                return;
            }

            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('appWrapper').style.display = 'flex';
            document.getElementById('myAvatar').innerText = currentUser.username.charAt(0).toUpperCase();

            // Apply Special Admin UI
            if(currentUser.role === 'admin') {
                document.body.classList.add('admin-mode');
                document.getElementById('adminBroadcastDiv').style.display = 'flex';
            } else {
                document.body.classList.remove('admin-mode');
                document.getElementById('adminBroadcastDiv').style.display = 'none';
            }

            renderAll();
        }

        function switchTab(name) {
            document.querySelectorAll('.tab-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.side-link').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            const section = document.getElementById(`tab-${name}`);
            if(section) section.classList.add('active');

            const side = document.getElementById(`side-${name}`);
            if(side) side.classList.add('active');

            const nav = document.getElementById(`nav-${name}`);
            if(nav) nav.classList.add('active');

            if(name === 'admin' && currentUser.role === 'admin') {
                renderAdminUsers();
            }
        }

        // --- 4. RENDER CONTENT ---
        function getAvatar(name) { return name === 'The Developer' ? '👑' : name.charAt(0).toUpperCase(); }
        function getBadge(isWorldwide) { return isWorldwide ? `<span class="admin-badge">WORLDWIDE</span>` : ''; }

        function renderAll() {
            renderStories();
            renderVideos();
            renderReels();
            renderPosts();
        }

        function renderStories() {
            const bar = document.getElementById('storiesBar');
            bar.innerHTML = `
                <div class="story-circle" onclick="openModal('uploadModal')">
                    <div class="ring" style="background: #333;"><div class="ring-avatar">+</div></div>
                    <span class="story-name">Add Story</span>
                </div>
            `;
            if(db.stories.length === 0) return;
            
            db.stories.forEach(s => {
                const color = s.isWorldwide ? 'var(--admin-gold)' : 'var(--primary)';
                bar.innerHTML += `
                    <div class="story-circle">
                        <div class="ring" style="background: ${color};"><div class="ring-avatar">${getAvatar(s.author)}</div></div>
                        <span class="story-name" style="${s.isWorldwide ? 'color:var(--admin-gold);font-weight:bold;' : ''}">${s.author}</span>
                    </div>
                `;
            });
        }

        function renderVideos() {
            const grid = document.getElementById('videoGrid');
            if(db.videos.length === 0) { grid.innerHTML = `<div class="empty-state">No videos uploaded yet. Be the first!</div>`; return; }
            grid.innerHTML = '';
            
            db.videos.forEach(v => {
                const mediaHtml = v.videoData 
                    ? `<video src="${v.videoData}" class="v-thumb" style="object-fit: cover;" controls></video>`
                    : `<div class="v-thumb" style="background:${v.bg}">▶️</div>`;

                grid.innerHTML += `
                    <div class="v-card">
                        ${mediaHtml}
                        <div class="v-meta" style="${v.isWorldwide ? 'border-top: 2px solid var(--admin-gold); background: #1a1a00;' : ''}">
                            <div class="v-avatar">${getAvatar(v.author)}</div>
                            <div class="v-info">
                                <h4>${v.title} ${getBadge(v.isWorldwide)}</h4>
                                <p>@${v.author} • 0 views</p>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function renderReels() {
            const grid = document.getElementById('reelsGrid');
            if(db.reels.length === 0) { grid.innerHTML = `<div class="empty-state">No reels available.</div>`; return; }
            grid.innerHTML = '';
            
            db.reels.forEach(r => {
                const mediaHtml = r.videoData 
                    ? `<video src="${r.videoData}" class="r-bg" style="object-fit: cover;" autoplay loop muted></video>`
                    : `<div class="r-bg" style="background:${r.bg}">📱</div>`;

                grid.innerHTML += `
                    <div class="r-card" style="${r.isWorldwide ? 'border: 2px solid var(--admin-gold);' : ''}">
                        ${mediaHtml}
                        <div class="r-overlay">
                            <strong>${r.title} ${getBadge(r.isWorldwide)}</strong>
                            <span style="${r.isWorldwide ? 'color:var(--admin-gold);' : ''}">@${r.author}</span>
                        </div>
                    </div>
                `;
            });
        }

        function renderPosts() {
            const wrap = document.getElementById('feedWrap');
            if(db.posts.length === 0) { wrap.innerHTML = `<div class="empty-state">No feed posts yet.</div>`; return; }
            wrap.innerHTML = '';

            db.posts.forEach(p => {
                const mediaHtml = p.videoData 
                    ? `<video src="${p.videoData}" class="post-media" style="object-fit: contain; background: #000;" controls></video>`
                    : `<div class="post-media" style="background:${p.bg}">📸</div>`;

                wrap.innerHTML += `
                    <div class="post-card" style="${p.isWorldwide ? 'border: 1px solid var(--admin-gold); box-shadow: 0 0 10px rgba(255,215,0,0.1);' : ''}">
                        <div class="post-top">
                            <div class="v-avatar">${getAvatar(p.author)}</div>
                            <strong style="${p.isWorldwide ? 'color:var(--admin-gold);' : ''}">@${p.author} ${getBadge(p.isWorldwide)}</strong>
                        </div>
                        ${mediaHtml}
                        <div class="post-caption-box" style="margin-top: 10px;">
                            <strong>@${p.author}</strong> ${p.caption}
                        </div>
                    </div>
                `;
            });
        }

        // --- 5. ADMIN CONTROLS ---
        function renderAdminUsers() {
            const list = document.getElementById('adminUserList');
            list.innerHTML = '';
            if(db.users.length === 0) {
                list.innerHTML = `<div style="color:var(--text-sub);">No regular users have signed up yet.</div>`;
                return;
            }
            db.users.forEach(u => {
                list.innerHTML += `
                    <div class="admin-user-card">
                        <div>
                            <strong style="font-size:16px;">@${u.username}</strong><br>
                            <span style="font-size:12px; color:var(--text-sub);">Password: ${u.password}</span>
                        </div>
                        <button class="create-btn" style="background:#ef4444;" onclick="deleteUser('${u.username}')">Delete User</button>
                    </div>
                `;
            });
        }

        function deleteUser(username) {
            db.users = db.users.filter(u => u.username !== username);
            saveDb();
            renderAdminUsers();
        }

        // --- 6. UPLOAD / PUBLISH LOGIC ---
        function handlePublish() {
            const type = document.getElementById('upType').value;
            const title = document.getElementById('upTitle').value || "New Post";
            const isWorldwide = document.getElementById('adminBroadcastCheck')?.checked || false;
            const fileInput = document.getElementById('upFile');
            const file = fileInput.files[0];

            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    finalizePublish(type, title, isWorldwide, e.target.result);
                };
                reader.readAsDataURL(file); // Convert video to base64 string
            } else {
                finalizePublish(type, title, isWorldwide, null);
            }
        }

        function finalizePublish(type, title, isWorldwide, videoData) {
            const bgColors = ['#ff0055', '#ffaa00', '#00c6ff', '#8A2387', '#11998e'];
            const randomBg = `linear-gradient(45deg, ${bgColors[Math.floor(Math.random()*bgColors.length)]}, #222)`;

            const item = {
                id: Date.now().toString(),
                author: currentUser.username,
                title: title,
                caption: title,
                bg: randomBg,
                isWorldwide: isWorldwide,
                videoData: videoData // Storing the base64 video string
            };

            if(type === 'video') { db.videos.unshift(item); switchTab('home'); }
            else if(type === 'reel') { db.reels.unshift(item); switchTab('reels'); }
            else if(type === 'post') { db.posts.unshift(item); switchTab('feed'); }
            else if(type === 'story') { db.stories.unshift(item); }

            saveDb();
            renderAll();
            closeModal('uploadModal');
            document.getElementById('upTitle').value = '';
            document.getElementById('upFile').value = '';
            if(document.getElementById('adminBroadcastCheck')) document.getElementById('adminBroadcastCheck').checked = false;
        }

        // Modals
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // Start
        initApp();
    </script>
</body>
</html>
