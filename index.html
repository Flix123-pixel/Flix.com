<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flix - Stream Movies & TV Shows</title>
    <style>
        :root {
            --primary-red: #e50914;
            --primary-red-hover: #c10711;
            --bg-color: #000000;
            --card-bg: rgba(0, 0, 0, 0.75);
            --input-bg: #333333;
            --text-color: #ffffff;
            --text-muted: #8c8c8c;
            --error-color: #e87c03;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.8) 0%, rgba(0, 0, 0, 0.4) 60%, rgba(0, 0, 0, 0.8) 100%), url('https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?q=80&w=2069&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .logo {
            color: var(--primary-red);
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 2rem;
            text-align: center;
        }

        .auth-container {
            display: flex;
            gap: 2rem;
            max-width: 1000px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .auth-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 3rem 4rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .auth-card h2 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .form-group {
            position: relative;
            margin-bottom: 1rem;
        }

        .form-control {
            width: 100%;
            background-color: var(--input-bg);
            color: var(--text-color);
            border: none;
            border-radius: 4px;
            padding: 1rem;
            font-size: 1rem;
            transition: outline 0.2s ease;
        }

        .form-control:focus {
            outline: 2px solid var(--primary-red);
            background-color: #454545;
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
        }
        
        .toggle-password:hover {
            color: var(--text-color);
        }

        .btn-primary {
            width: 100%;
            padding: 1rem;
            background-color: var(--primary-red);
            color: var(--text-color);
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: background-color 0.2s ease;
        }

        .btn-primary:hover {
            background-color: var(--primary-red-hover);
        }

        .error-message {
            color: var(--error-color);
            font-size: 0.85rem;
            margin-top: 0.3rem;
            display: none;
        }

        /* Responsive adjustments */
        @media (max-width: 900px) {
            .auth-container {
                flex-direction: column;
                align-items: center;
            }
            .auth-card {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>

    <div class="logo">Flix</div>

    <div class="auth-container">
        <!-- Login Card -->
        <div class="auth-card">
            <h2>Sign In</h2>
            <form id="loginForm" novalidate>
                <div class="form-group">
                    <input type="text" id="loginUser" class="form-control" placeholder="Email or Username" required>
                    <div class="error-message" id="loginUserError">Please enter a valid email or username.</div>
                </div>
                
                <div class="form-group password-wrapper">
                    <input type="password" id="loginPass" class="form-control" placeholder="Password" required>
                    <button type="button" class="toggle-password" onclick="toggleVisibility('loginPass', this)">SHOW</button>
                    <div class="error-message" id="loginPassError">Your password must contain between 4 and 60 characters.</div>
                </div>
                
                <div class="error-message" id="loginGlobalError" style="margin-top: 1rem; color: var(--error-color);"></div>

                <button type="submit" class="btn-primary">Sign In</button>
            </form>
        </div>

        <!-- Create Account Card -->
        <div class="auth-card">
            <h2>Create Account</h2>
            <form id="signupForm" novalidate>
                <div class="form-group">
                    <input type="text" id="signupName" class="form-control" placeholder="Full Name" required>
                    <div class="error-message" id="signupNameError">Full name is required.</div>
                </div>

                <div class="form-group">
                    <input type="text" id="signupUsername" class="form-control" placeholder="Username (e.g., demoUser)" required>
                    <div class="error-message" id="signupUsernameError">Username is required.</div>
                </div>

                <div class="form-group">
                    <input type="email" id="signupEmail" class="form-control" placeholder="Email Address" required>
                    <div class="error-message" id="signupEmailError">Please enter a valid email address.</div>
                </div>
                
                <div class="form-group password-wrapper">
                    <input type="password" id="signupPass" class="form-control" placeholder="Password (e.g., YourPassword123)" required>
                    <button type="button" class="toggle-password" onclick="toggleVisibility('signupPass', this)">SHOW</button>
                    <div class="error-message" id="signupPassError">Password is required.</div>
                </div>

                <div class="form-group password-wrapper">
                    <input type="password" id="signupConfirmPass" class="form-control" placeholder="Confirm Password" required>
                    <button type="button" class="toggle-password" onclick="toggleVisibility('signupConfirmPass', this)">SHOW</button>
                    <div class="error-message" id="signupConfirmPassError">Passwords do not match.</div>
                </div>

                <div class="error-message" id="signupGlobalError" style="margin-top: 1rem; color: #4bb543;"></div>

                <button type="submit" class="btn-primary">Get Started</button>
            </form>
        </div>
    </div>

    <script>
        // Toggle Password Visibility Logic
        function toggleVisibility(inputId, btnElement) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                btnElement.textContent = "HIDE";
            } else {
                input.type = "password";
                btnElement.textContent = "SHOW";
            }
        }

        // Login Form Validation
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Prevent actual form submission for demo
            let isValid = true;
            
            const user = document.getElementById('loginUser');
            const pass = document.getElementById('loginPass');
            const userError = document.getElementById('loginUserError');
            const passError = document.getElementById('loginPassError');
            const globalError = document.getElementById('loginGlobalError');

            // Reset errors
            userError.style.display = 'none';
            passError.style.display = 'none';
            globalError.style.display = 'none';

            if (user.value.trim() === '') {
                userError.style.display = 'block';
                isValid = false;
            }

            if (pass.value.trim() === '') {
                passError.style.display = 'block';
                isValid = false;
            }

            if (isValid) {
                // IMPORTANT: This is demo logic. Never handle real auth purely on the frontend.
                // In a real app, send credentials securely to your backend via API.
                globalError.style.color = '#4bb543'; // Success green
                globalError.textContent = "Demo login successful! (Backend connection required for real app)";
                globalError.style.display = 'block';
            }
        });

        // Sign Up Form Validation
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Prevent actual form submission for demo
            let isValid = true;
            
            const fields = ['Name', 'Username', 'Email', 'Pass', 'ConfirmPass'];
            
            // Reset all errors
            fields.forEach(field => {
                document.getElementById('signup' + field + 'Error').style.display = 'none';
            });
            document.getElementById('signupGlobalError').style.display = 'none';

            // Check for empty fields
            fields.forEach(field => {
                const el = document.getElementById('signup' + field);
                if (el.value.trim() === '') {
                    document.getElementById('signup' + field + 'Error').style.display = 'block';
                    isValid = false;
                }
            });

            // Password mismatch check
            const pass = document.getElementById('signupPass').value;
            const confirmPass = document.getElementById('signupConfirmPass').value;
            
            if (pass !== '' && confirmPass !== '' && pass !== confirmPass) {
                const confirmError = document.getElementById('signupConfirmPassError');
                confirmError.textContent = "Passwords do not match.";
                confirmError.style.display = 'block';
                isValid = false;
            }

            if (isValid) {
                // IMPORTANT: In a real app, hash passwords on the backend and store them securely in a database.
                document.getElementById('signupGlobalError').textContent = "Demo account created successfully! (Backend connection required for real app)";
                document.getElementById('signupGlobalError').style.display = 'block';
                this.reset(); // Clear form
            }
        });
    </script>
</body>
</html>
