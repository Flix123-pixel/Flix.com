<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090e"><title>Flix — Watch. Create. Connect.</title><style>
:root{--bg:#08090e;--card:#121521;--card2:#1a1e2d;--line:#292f43;--text:#f6f7fb;--muted:#9299b0;--blue:#5b8cff;--violet:#a855f7;--red:#ff5577}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#1e2452 0,transparent 32%),var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1320px;margin:auto;min-height:100vh}header{height:70px;display:flex;align-items:center;gap:28px;padding:0 24px;border-bottom:1px solid var(--line);background:#08090ecc;backdrop-filter:blur(18px);position:sticky;top:0;z-index:5}.logo{font-size:27px;font-weight:900;letter-spacing:-1px;background:linear-gradient(100deg,#65a1ff,#bd73ff);-webkit-background-clip:text;color:transparent}.search{flex:1;max-width:480px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 15px;color:#fff;outline:0}.search:focus{border-color:var(--blue)}.head-actions{display:flex;gap:9px;align-items:center;margin-left:auto}.btn{background:var(--card2);border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:10px;font-weight:700}.btn:hover{border-color:#7280ad;transform:translateY(-1px)}.primary{background:linear-gradient(110deg,var(--blue),var(--violet));border:0}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--violet));font-weight:900;cursor:pointer}.layout{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 70px)}aside{border-right:1px solid var(--line);padding:24px 14px}.nav{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--muted);padding:13px 15px;border-radius:10px;font-weight:700;margin-bottom:5px}.nav:hover,.nav.active{background:var(--card2);color:#fff}.content{padding:26px;min-width:0}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.hero h1{font-size:30px;margin:0 0 6px;letter-spacing:-1px}.hero p{margin:0;color:var(--muted)}.chips{display:flex;gap:9px;overflow:auto;margin-bottom:22px}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:22px;padding:9px 15px;cursor:pointer}.chip.active,.chip:hover{background:#fff;color:#07080d;border-color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden;position:relative;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#58678f;box-shadow:0 14px 35px #0006}.media{width:100%;aspect-ratio:16/9;object-fit:cover;background:#05060a;display:block}.meta{padding:13px 14px 15px;display:flex;gap:11px}.mini{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#36466f,#7c3aed);font-weight:800}.info{min-width:0}.info strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info span{display:block;color:var(--muted);font-size:12px;margin-top:5px}.like{position:absolute;right:10px;top:10px;border:0;border-radius:20px;background:#0009;color:#fff;padding:7px 9px}.liked{color:#ff5577}.empty{text-align:center;padding:80px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:15px}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:10;padding:18px}.modal.open{display:grid}.dialog{width:min(460px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 20px 80px #000}.dialog h2{margin:0 0 18px}.form{display:grid;gap:12px}.form input,.form select{padding:12px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:#fff;outline:0}.form input:focus{border-color:var(--blue)}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#090a10;padding:11px 16px;border-radius:10px;font-weight:700;display:none;z-index:20}@media(max-width:760px){header{gap:12px;padding:0 14px}.search{order:3;position:absolute;top:78px;left:14px;right:14px;max-width:none}.layout{grid-template-columns:1fr;padding-top:55px}aside{display:flex;overflow:auto;border:0;border-bottom:1px solid var(--line);padding:8px 14px;gap:5px;position:sticky;top:70px;background:#08090ef2;z-index:4}.nav{white-space:nowrap;width:auto;margin:0}.content{padding:18px 14px}.head-actions .btn{display:none}.hero h1{font-size:25px}}
</style></head><body><div class="shell"><header><div class="logo">Flix</div><input class="search" id="search" placeholder="Search videos, creators, categories…"><div class="head-actions"><button class="btn primary" id="uploadBtn">＋ Upload</button><div class="avatar" id="avatar" title="Sign in">?</div></div></header><div class="layout"><aside><button class="nav active" data-view="home">⌂ Home</button><button class="nav" data-view="shorts">▣ Shorts</button><button class="nav" data-view="saved">♡ Saved</button><button class="nav" data-view="about">ⓘ About</button></aside><main class="content"><section class="hero"><div><h1 id="heading">Discover your next favorite</h1><p id="sub">Fresh videos from the Flix community.</p></div></section><div class="chips" id="chips"><button class="chip active" data-cat="All">All</button><button class="chip" data-cat="Gaming">Gaming</button><button class="chip" data-cat="Funny">Funny</button><button class="chip" data-cat="Music">Music</button><button class="chip" data-cat="Education">Education</button><button class="chip" data-cat="Travel">Travel</button></div><div class="grid" id="grid"></div></main></div></div><div class="modal" id="modal"><div class="dialog"><div class="row"><h2 id="modalTitle">Create an account</h2><button class="btn" id="close">×</button></div><form class="form" id="form"><input id="username" required minlength="2" placeholder="Your display name"><input id="media" required type="url" placeholder="Media URL (MP4, image, YouTube embed)"><input id="title" required maxlength="80" placeholder="Video title"><select id="category"><option>Gaming</option><option>Funny</option><option>Music</option><option>Education</option><option>Travel</option></select><button class="btn primary" type="submit">Publish to Flix</button></form></div></div><div class="toast" id="toast"></div><script>
const KEY='flix_local_v2',defaultItems=[{id:'welcome',title:'Welcome to Flix',author:'Flix Team',category:'Education',url:'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4',likes:12},{id:'travel',title:'A quiet day by the sea',author:'Maya',category:'Travel',url:'https://storage.googleapis.com/coverr-main/mp4/Mt_Baker.mp4',likes:8}];let state=JSON.parse(localStorage.getItem(KEY)||'null')||{user:null,items:defaultItems,saved:[]},category='All',view='home';const $=id=>document.getElementById(id),save=()=>localStorage.setItem(KEY,JSON.stringify(state)),toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t.x);t.x=setTimeout(()=>t.style.display='none',2400)};
function initials(n){return(n||'?').trim().charAt(0).toUpperCase()}function safe(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function media(url){const u=safe(url);if(/\.(jpg|jpeg|png|gif|webp)(\?|$)/i.test(url))return`<img class="media" src="${u}" loading="lazy" alt="">`;return`<video class="media" src="${u}" controls preload="metadata"></video>`}
function render(){let list=state.items.filter(x=>view==='saved'?state.saved.includes(x.id):view==='shorts'?x.short!==false:true);if(category!=='All')list=list.filter(x=>x.category===category);const q=$('search').value.toLowerCase().trim();if(q)list=list.filter(x=>(x.title+x.author+x.category).toLowerCase().includes(q));$('grid').innerHTML=list.length?list.map(x=>`<article class="card">${media(x.url)}<button class="like ${state.saved.includes(x.id)?'liked':''}" data-like="${x.id}">${state.saved.includes(x.id)?'♥':'♡'} ${x.likes||0}</button><div class="meta"><div class="mini">${initials(x.author)}</div><div class="info"><strong>${safe(x.title)}</strong><span>${safe(x.author)} · ${safe(x.category)}</span></div></div></article>`).join(''):`<div class="empty" style="grid-column:1/-1">No videos match this view yet.<br><button class="btn primary" style="margin-top:15px" onclick="openUpload()">Upload the first one</button></div>`;document.querySelectorAll('[data-like]').forEach(b=>b.onclick=()=>{const id=b.dataset.like;state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];save();render()})}
function openUpload(){if(!state.user){$('modalTitle').textContent='Sign in to publish';$('form').innerHTML='<input id="loginName" required placeholder="Display name"><button class="btn primary">Continue</button>';$('form').onsubmit=e=>{e.preventDefault();state.user=$('loginName').value.trim();save();$('modal').classList.remove('open');updateUser();toast('Welcome to Flix, '+state.user+'!')};}else{ $('modalTitle').textContent='Publish a video';$('form').innerHTML='<input id="media" required type="url" placeholder="Media URL (MP4 or image)"><input id="title" required maxlength="80" placeholder="Video title"><select id="category"><option>Gaming</option><option>Funny</option><option>Music</option><option>Education</option><option>Travel</option></select><button class="btn primary">Publish to Flix</button>';$('form').onsubmit=e=>{e.preventDefault();state.items.unshift({id:Date.now().toString(),title:$('title').value,author:state.user,category:$('category').value,url:$('media').value,likes:0,short:false});save();$('modal').classList.remove('open');render();toast('Published successfully')};}$('modal').classList.add('open')}
function updateUser(){$('avatar').textContent=initials(state.user);$('avatar').title=state.user?'Signed in as '+state.user:'Sign in'}$('uploadBtn').onclick=openUpload;$('avatar').onclick=()=>state.user?(state.user=null,save(),updateUser(),toast('Signed out')):openUpload;$('close').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};$('search').oninput=render;document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{category=b.dataset.cat;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('heading').textContent=view==='saved'?'Your saved videos':view==='shorts'?'Shorts':'Discover your next favorite';$('chips').style.display=view==='about'?'none':'flex';if(view==='about')$('grid').innerHTML='<div class="empty" style="grid-column:1/-1"><h2>Flix</h2>Share, discover and support independent creators.<br>This static build stores demo data locally in your browser.</div>';else render()});updateUser();render();
</script></body></html>
